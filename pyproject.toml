[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "borumi"
version = "0.1.0"
description = "Automatic marketing video editor: clips in, finished Reels/TikTok/YouTube videos out"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
captions = ["openai-whisper"]
dev = ["pytest"]

[project.scripts]
borumi = "borumi.cli:main"

[tool.setuptools]
packages = ["borumi"]
